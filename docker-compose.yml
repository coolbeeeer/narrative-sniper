version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    depends_on:
      - backend
    networks:
      - narrative-sniper
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - HELIUS_API_KEY=${HELIUS_API_KEY}
      - JUPITER_API_KEY=${JUPITER_API_KEY}
      - JITO_API_KEY=${JITO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - J7_ENABLED=${J7_ENABLED:-true}
      - J7_SESSION_TOKEN=${J7_SESSION_TOKEN}
      - SIGNAL_ENABLED=${SIGNAL_ENABLED:-true}
      - SIGNAL_CONFIDENCE_THRESHOLD=${SIGNAL_CONFIDENCE_THRESHOLD:-0.7}
      - SIGNAL_MIN_CLUSTER_SIZE=${SIGNAL_MIN_CLUSTER_SIZE:-10}
      - SIGNAL_POSITION_SIZE_USD=${SIGNAL_POSITION_SIZE_USD:-100.0}
      - SIGNAL_MAX_OPEN_POSITIONS=${SIGNAL_MAX_OPEN_POSITIONS:-5}
      - SIGNAL_COOLDOWN_HOURS=${SIGNAL_COOLDOWN_HOURS:-24}
      - SIGNAL_TAKE_PROFIT_PCT=${SIGNAL_TAKE_PROFIT_PCT:-30.0}
      - SIGNAL_STOP_LOSS_PCT=${SIGNAL_STOP_LOSS_PCT:-15.0}
      - LAUNCHES_ENABLED=${LAUNCHES_ENABLED:-true}
      - LAUNCHES_POLL_SECONDS=${LAUNCHES_POLL_SECONDS:-60}
      - LAUNCHES_MAX_PER_POLL=${LAUNCHES_MAX_PER_POLL:-50}
      - SAFETY_ENABLED=${SAFETY_ENABLED:-true}
      - SAFETY_MAX_RISK_SCORE=${SAFETY_MAX_RISK_SCORE:-60}
      - SAFETY_MIN_LIQUIDITY_USD=${SAFETY_MIN_LIQUIDITY_USD:-20000.0}
      - SAFETY_MIN_VOLUME_H24_USD=${SAFETY_MIN_VOLUME_H24_USD:-10000.0}
      - J7_ENABLED=${J7_ENABLED:-true}
      - J7_SESSION_TOKEN=${J7_SESSION_TOKEN}
      - SIGNAL_ENABLED=${SIGNAL_ENABLED:-true}
      - SIGNAL_CONFIDENCE_THRESHOLD=${SIGNAL_CONFIDENCE_THRESHOLD:-0.7}
      - SIGNAL_MIN_CLUSTER_SIZE=${SIGNAL_MIN_CLUSTER_SIZE:-10}
      - SIGNAL_POSITION_SIZE_USD=${SIGNAL_POSITION_SIZE_USD:-100.0}
      - SIGNAL_MAX_OPEN_POSITIONS=${SIGNAL_MAX_OPEN_POSITIONS:-5}
      - SIGNAL_COOLDOWN_HOURS=${SIGNAL_COOLDOWN_HOURS:-24}
      - SIGNAL_TAKE_PROFIT_PCT=${SIGNAL_TAKE_PROFIT_PCT:-30.0}
      - SIGNAL_STOP_LOSS_PCT=${SIGNAL_STOP_LOSS_PCT:-15.0}
      - LAUNCHES_ENABLED=${LAUNCHES_ENABLED:-true}
      - LAUNCHES_POLL_SECONDS=${LAUNCHES_POLL_SECONDS:-60}
      - LAUNCHES_MAX_PER_POLL=${LAUNCHES_MAX_PER_POLL:-50}
      - SAFETY_ENABLED=${SAFETY_ENABLED:-true}
      - SAFETY_MAX_RISK_SCORE=${SAFETY_MAX_RISK_SCORE:-60}
      - SAFETY_MIN_LIQUIDITY_USD=${SAFETY_MIN_LIQUIDITY_USD:-20000.0}
      - SAFETY_MIN_VOLUME_H24_USD=${SAFETY_MIN_VOLUME_H24_USD:-10000.0}
    networks:
      - narrative-sniper
    restart: unless-stopped

networks:
  narrative-sniper:
    driver: bridge